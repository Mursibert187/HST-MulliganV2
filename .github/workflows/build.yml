name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test src/MulliganCore.Tests --configuration Release

  plugin:
    name: Plugin (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Fetch HDT reference assemblies
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-hdt.ps1
      - name: Build plugin
        run: dotnet build src/MulliganPlugin --configuration Release
      - uses: actions/upload-artifact@v4
        with:
          name: HstMulliganV2
          path: src/MulliganPlugin/bin/Release/net472/HstMulliganV2.dll
          if-no-files-found: error
